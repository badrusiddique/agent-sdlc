# Local dependencies for BuildGenix.WebApi (D-CL-2: Docker local only).
# Official Service Bus emulator + Azurite.
name: buildgenix-local

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: buildgenix-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: buildgenix-sqledge
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-BuildGenix_Local_Str0ng!}
    networks:
      sb-emulator:
        aliases:
          - sqledge

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: buildgenix-servicebus-emulator
    pull_policy: always
    volumes:
      - ./docker/servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-BuildGenix_Local_Str0ng!}
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      EMULATOR_HTTP_PORT: 5300
      SQL_WAIT_INTERVAL: 30
    depends_on:
      - sqledge
    networks:
      sb-emulator:
        aliases:
          - sb-emulator

networks:
  sb-emulator:

volumes:
  azurite-data:
