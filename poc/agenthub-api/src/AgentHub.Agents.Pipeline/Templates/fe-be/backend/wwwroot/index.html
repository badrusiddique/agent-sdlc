<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculator</title>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5b6775;
      --line: #d7dde5;
      --panel: #f3f6f9;
      --accent: #0f6e56;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, #e7f3ee 0%, transparent 42%),
        linear-gradient(180deg, #f8fafc 0%, #eef2f6 100%);
      min-height: 100vh;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.85rem; letter-spacing: -0.02em; }
    .lead { color: var(--muted); margin: 0 0 1.5rem; line-height: 1.45; }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end; margin-bottom: 1rem; }
    label { display: grid; gap: 0.3rem; font-size: 0.85rem; color: var(--muted); }
    input {
      width: 7rem;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      background: #fff;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button.ghost {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .panel {
      margin-top: 1.25rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }
    .panel h2 {
      margin: 0;
      padding: 0.7rem 1rem;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .panel pre {
      margin: 0;
      padding: 1rem;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, "Cascadia Mono", monospace;
      font-size: 0.9rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main>
    <h1>{{HEADLINE}}</h1>
    <p class="lead">Calculator shell talking to a .NET API. Each click shows the HTTP request and the JSON that came back.</p>
    <div class="row">
      <label>a <input id="a" type="number" value="2" /></label>
      <label>b <input id="b" type="number" value="3" /></label>
      <div class="actions">
        <button id="addBtn" type="button">Add</button>
        <!-- {{EXTRA_UI}} -->
      </div>
    </div>
    <section class="panel">
      <h2>Request</h2>
      <pre id="req">Waiting for a call…</pre>
    </section>
    <section class="panel">
      <h2>Response</h2>
      <pre id="res">—</pre>
    </section>
  </main>
  <script>
    async function callApi(path) {
      const a = Number(document.getElementById('a').value);
      const b = Number(document.getElementById('b').value);
      const url = `${path}?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`;
      document.getElementById('req').textContent = `GET ${url}`;
      document.getElementById('res').textContent = 'Loading…';
      const r = await fetch(url);
      const text = await r.text();
      let pretty = text;
      try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch { /* keep raw */ }
      document.getElementById('res').textContent = `${r.status} ${r.statusText}\n${pretty}`;
    }
    document.getElementById('addBtn').addEventListener('click', () => callApi('/api/add'));
  </script>
</body>
</html>
