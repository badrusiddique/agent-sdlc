# Local dependencies for AgentHub.WebApi (D-CL-2: Docker local only).
# Official Service Bus emulator + Azurite.
# Port map matches BuildGenix local defaults; do not run both compose stacks at once.
#
# NOTE: On some cloud VMs, Docker bridge inter-container traffic is blocked
# (iptables-legacy FORWARD DROP). SQL Edge and the Service Bus emulator therefore
# share one network namespace so the emulator reaches SQL on 127.0.0.1.
name: agenthub-local

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: agenthub-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data

  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: agenthub-sqledge
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-AgentHub_Local_Str0ng!}
    ports:
      - "5672:5672"
      - "5300:5300"
    # SQL tools / diagnostics only; emulator shares this namespace.
    # 1433 is not published to avoid host conflicts.

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: agenthub-servicebus-emulator
    pull_policy: always
    network_mode: "service:sqledge"
    volumes:
      - ./docker/servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    environment:
      SQL_SERVER: 127.0.0.1
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-AgentHub_Local_Str0ng!}
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      EMULATOR_HTTP_PORT: 5300
      SQL_WAIT_INTERVAL: 15
    depends_on:
      - sqledge

  # Local AzDo/GitHub stand-in for IA Push & Deploy (PRs + git push).
  gitea:
    image: gitea/gitea:1.22.6
    container_name: agenthub-gitea
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: http://127.0.0.1:43185/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
    ports:
      - "43185:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data

volumes:
  azurite-data:
  gitea-data:
